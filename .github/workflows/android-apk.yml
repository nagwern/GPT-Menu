
name: Build GPT Menu APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find SDK manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android components
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q GPT_Menu_GitHub_Actions_OnePlus_Ace_5.zip -d extracted
          test -f extracted/GPT_Menu_CPP/app/build.gradle.kts

      - name: Build APK
        run: |
          cd extracted/GPT_Menu_CPP
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Menu-APK
          path: extracted/GPT_Menu_CPP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
