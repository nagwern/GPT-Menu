
name: Build GPT Menu APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q GPT_Menu_GitHub_Actions_OnePlus_Ace_5.zip
          cd GPT_Menu_CPP
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: cd "$PROJECT_DIR" && gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Menu-APK
          path: GPT_Menu_CPP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
